<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Puzzle Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', system-ui; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 1rem; }
    .sudoku-card { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 2rem; width: 100%; max-width: 500px; box-shadow: 0 25px 50px rgba(0,0,0,0.6); text-align: center; }
    .sudoku-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; background: #334155; border: 3px solid #6366f1; border-radius: 12px; padding: 2px; margin-bottom: 1.5rem; overflow: hidden; }
    .sudoku-cell { aspect-ratio: 1; background: #090d16; border: 1px solid #1e293b; color: #fff; font-size: 1.25rem; font-weight: bold; text-align: center; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
    .sudoku-cell.given { background: #1e293b; color: #38bdf8; font-weight: 800; cursor: default; }
    .sudoku-cell.selected { background: #312e81; border: 2px solid #818cf8; }
    .sudoku-cell.block-border-r { border-right: 3px solid #6366f1; }
    .sudoku-cell.block-border-b { border-bottom: 3px solid #6366f1; }
    .num-pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; margin-bottom: 1.5rem; }
    .num-btn { background: #334155; border: none; color: #fff; border-radius: 10px; padding: 0.6rem 0; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
    .num-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div class="sudoku-card">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h4 text-indigo-400 font-bold mb-0">🧩 Sudoku 9x9</h2>
      <span id="timer-text" class="badge bg-dark border border-secondary text-info p-2 font-mono">00:00</span>
    </div>

    <div id="sudoku-grid" class="sudoku-grid"></div>

    <div class="num-pad">
      <button class="num-btn" onclick="inputNum(1)">1</button>
      <button class="num-btn" onclick="inputNum(2)">2</button>
      <button class="num-btn" onclick="inputNum(3)">3</button>
      <button class="num-btn" onclick="inputNum(4)">4</button>
      <button class="num-btn" onclick="inputNum(5)">5</button>
      <button class="num-btn" onclick="inputNum(6)">6</button>
      <button class="num-btn" onclick="inputNum(7)">7</button>
      <button class="num-btn" onclick="inputNum(8)">8</button>
      <button class="num-btn" onclick="inputNum(9)">9</button>
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-primary font-bold flex-1" onclick="newGame()">✨ New Game</button>
      <button class="btn btn-outline-danger font-bold flex-1" onclick="clearCell()">🗑️ Clear</button>
    </div>
  </div>

  <script>
    let selectedCellIdx = null;
    let seconds = 0;
    let timerInterval = null;

    const initialBoard = [
      5,3,0, 0,7,0, 0,0,0,
      6,0,0, 1,9,5, 0,0,0,
      0,9,8, 0,0,0, 0,6,0,

      8,0,0, 0,6,0, 0,0,3,
      4,0,0, 8,0,3, 0,0,1,
      7,0,0, 0,2,0, 0,0,6,

      0,6,0, 0,0,0, 2,8,0,
      0,0,0, 4,1,9, 0,0,5,
      0,0,0, 0,8,0, 0,7,9
    ];

    let currentBoard = [...initialBoard];

    function renderGrid() {
      const grid = document.getElementById('sudoku-grid');
      grid.innerHTML = '';

      for (let i = 0; i < 81; i++) {
        const cell = document.createElement('div');
        cell.className = 'sudoku-cell';
        const col = i % 9;
        const row = Math.floor(i / 9);

        if (col === 2 || col === 5) cell.classList.add('block-border-r');
        if (row === 2 || row === 5) cell.classList.add('block-border-b');

        if (initialBoard[i] !== 0) {
          cell.classList.add('given');
          cell.textContent = initialBoard[i];
        } else {
          if (currentBoard[i] !== 0) {
            cell.textContent = currentBoard[i];
          }
          cell.onclick = () => selectCell(i);
        }

        if (selectedCellIdx === i) {
          cell.classList.add('selected');
        }

        grid.appendChild(cell);
      }
    }

    function selectCell(idx) {
      if (initialBoard[idx] !== 0) return;
      selectedCellIdx = idx;
      renderGrid();
    }

    function inputNum(n) {
      if (selectedCellIdx === null) return;
      currentBoard[selectedCellIdx] = n;
      renderGrid();
    }

    function clearCell() {
      if (selectedCellIdx === null) return;
      currentBoard[selectedCellIdx] = 0;
      renderGrid();
    }

    function newGame() {
      seconds = 0;
      currentBoard = [...initialBoard];
      selectedCellIdx = null;
      renderGrid();
    }

    setInterval(() => {
      seconds++;
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      document.getElementById('timer-text').textContent = m + ':' + s;
    }, 1000);

    renderGrid();
  </script>
</body>
</html>
